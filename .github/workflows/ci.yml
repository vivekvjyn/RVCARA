name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Read the pinned ONNX Runtime commit
        id: onnxruntime
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:libs/onnxruntime)" >> "$GITHUB_OUTPUT"

      - name: Restore the ONNX Runtime build
        uses: actions/cache@v4
        with:
          path: build/onnxruntime-install
          key: onnxruntime-${{ runner.os }}-${{ steps.onnxruntime.outputs.sha }}

      - name: Initialise submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 libs/ARA_SDK libs/JUCE libs/googletest libs/hnswlib
          git -C libs/ARA_SDK submodule update --init --depth 1 ARA_API ARA_Library

          if [ ! -e build/onnxruntime-install/lib ]; then
            git submodule update --init --depth 1 libs/onnxruntime
            git -C libs/onnxruntime submodule update --init --depth 1 cmake/external/onnx
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Install Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        shell: bash
        run: |
          if [ -e build/onnxruntime-install/lib ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DRVCARA_ONNXRUNTIME_ROOT="$PWD/build/onnxruntime-install"
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

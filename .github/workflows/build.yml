name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with libs/onnxruntime/VERSION_NUMBER. CI links the prebuilt release of that
  # version rather than building the submodule, which takes 45 to 90 minutes per runner and
  # wants more disk than a hosted one has. Local and release builds still build it from source.
  ONNXRUNTIME_VERSION: 1.23.2

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen graphviz

      - name: Generate
        working-directory: docs
        run: doxygen Doxyfile

      - uses: actions/upload-artifact@v4
        with:
          name: RVCARA-docs
          path: docs/html
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            package: onnxruntime-linux-x64
          - name: macOS
            os: macos-latest
            package: onnxruntime-osx-universal2
          - name: Windows
            os: windows-latest
            package: onnxruntime-win-x64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialise submodules
        run: |
          git submodule update --init --depth 1 libs/ARA_SDK libs/JUCE libs/googletest libs/hnswlib
          git -C libs/ARA_SDK submodule update --init --depth 1 ARA_API ARA_Library

      - name: Fetch ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail

          version="${ONNXRUNTIME_VERSION}"
          package="${{ matrix.package }}-${version}"
          archive="${package}$([ "$RUNNER_OS" = "Windows" ] && echo .zip || echo .tgz)"

          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${version}/${archive}"

          mkdir unpacked
          if [ "$RUNNER_OS" = "Windows" ]; then
            unzip -q "$archive" -d unpacked
          else
            tar xzf "$archive" -C unpacked
          fi

          mv "unpacked/${package}" onnxruntime

      # JUCE's own list, from libs/JUCE/docs/Linux Dependencies.md, less the two we compile out:
      # libcurl for JUCE_USE_CURL=0 and webkit2gtk for JUCE_WEB_BROWSER=0.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev

      - name: Install Ninja
        if: runner.os == 'macOS'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Report the toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          [ -x "$vswhere" ] && "$vswhere" -latest -products '*' -property displayName || true
          cmake --version

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(pwd -W 2>/dev/null || pwd)"

          # Naming a Visual Studio version breaks the moment the runner image moves on, so let
          # CMake pick whichever one the image ships.
          if [ "$RUNNER_OS" = "Windows" ]; then
            generator=(-A x64)
          else
            generator=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
          fi

          # Warnings are errors where the compiler is one we have run this code through. MSVC has
          # not seen it yet, so Windows builds without it rather than going red on a warning that
          # cannot be reproduced anywhere else.
          if [ "$RUNNER_OS" = "Windows" ]; then
            strict=(-DRVCARA_WERROR=OFF)
          else
            strict=(-DRVCARA_WERROR=ON)
          fi

          cmake -S . -B build "${generator[@]}" "${strict[@]}" \
            -DRVCARA_ONNXRUNTIME_ROOT="$workspace/onnxruntime" \
            -DRVCARA_FETCH_NOTE_MODEL=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage what was built
        shell: bash
        run: |
          set -euo pipefail

          artefacts="build/RVCARA_artefacts/Release"
          [ -d "$artefacts" ] || artefacts="build/RVCARA_artefacts"

          mkdir -p staged
          for format in VST3 LV2 AU Standalone; do
            if [ -d "$artefacts/$format" ]; then
              cp -R "$artefacts/$format" staged/
            fi
          done

          find staged -maxdepth 2

      - uses: actions/upload-artifact@v4
        with:
          name: RVCARA-${{ matrix.name }}
          path: staged
          if-no-files-found: error

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            formats: VST3, LV2
          - name: macOS
            os: macos-latest
            formats: VST3, LV2, AU
          - name: Windows
            os: windows-latest
            formats: VST3, LV2

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Read the pinned ONNX Runtime commit
        id: onnxruntime
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:libs/onnxruntime)" >> "$GITHUB_OUTPUT"

      - name: Restore the ONNX Runtime build
        uses: actions/cache@v4
        with:
          path: build/onnxruntime-install
          key: onnxruntime-${{ runner.os }}-${{ steps.onnxruntime.outputs.sha }}

      - name: Initialise submodules
        shell: bash
        run: |
          git submodule update --init --depth 1 libs/ARA_SDK libs/JUCE libs/googletest libs/hnswlib
          git -C libs/ARA_SDK submodule update --init --depth 1 ARA_API ARA_Library

          if [ ! -e build/onnxruntime-install/lib ]; then
            git submodule update --init --depth 1 libs/onnxruntime
            git -C libs/onnxruntime submodule update --init --depth 1 cmake/external/onnx
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Install Ninja
        if: runner.os == 'macOS'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure
        shell: bash
        run: |
          workspace="$(pwd -W 2>/dev/null || pwd)"

          if [ "$RUNNER_OS" = "Windows" ]; then
            generator=(-G "Visual Studio 17 2022" -A x64)
          else
            generator=(-G Ninja -DCMAKE_BUILD_TYPE=Release)
          fi

          if [ -e build/onnxruntime-install/lib ]; then
            generator+=(-DRVCARA_ONNXRUNTIME_ROOT="$workspace/build/onnxruntime-install")
          fi

          cmake -S . -B build "${generator[@]}"

      - name: Build ${{ matrix.formats }}
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: List what was built
        shell: bash
        run: find build/RVCARA_artefacts -maxdepth 3 -name "*.vst3" -o -maxdepth 3 -name "*.lv2" -o -maxdepth 3 -name "*.component"

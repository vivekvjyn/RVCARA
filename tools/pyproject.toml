[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rvcara-export"
version = "0.1.0"
description = "Convert a trained RVC voice model into the inference assets the RVCARA plugin loads"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "../LICENSE" }
authors = [{ name = "vivekvjyn" }]
keywords = ["voice-conversion", "onnx", "audio-plugin", "ara", "rvc"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch",
    "numpy",
    "scipy",
    "soundfile",
    "librosa",
    "transformers",
    "faiss-cpu",
    "onnx",
    "onnxruntime",
]

[project.scripts]
rvcara-export = "rvcara_export.cli:main"

[tool.setuptools.packages.find]
include = ["rvcara_export*"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
